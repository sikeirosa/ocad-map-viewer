name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: ocad-map-viewer
  REGION: europe-west1
  SERVICE: ocad-map-viewer
  IMAGE: europe-west1-docker.pkg.dev/ocad-map-viewer/ocad-map-viewer/app

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1084238949684/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-actions@ocad-map-viewer.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t $IMAGE:$GITHUB_SHA -t $IMAGE:latest .
          docker push $IMAGE:$GITHUB_SHA
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image=$IMAGE:$GITHUB_SHA \
            --region=$REGION \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }},GCS_BUCKET=${{ secrets.GCS_BUCKET }}" \
            --port=8080 \
            --memory=4Gi \
            --cpu=2 \
            --timeout=300 \
            --min-instances=0 \
            --max-instances=3

      - name: Apply Artifact Registry cleanup policy
        # Governance FinOps : plafonne le stockage d'images (garde les 5 plus récentes, purge >30j).
        # Requiert roles/artifactregistry.admin sur le repo pour le SA github-actions (déjà accordé).
        continue-on-error: true
        run: bash infra/apply-ar-cleanup-policy.sh
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION: ${{ env.REGION }}
          AR_REPO: ocad-map-viewer
