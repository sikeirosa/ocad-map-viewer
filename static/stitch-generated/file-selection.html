<body class="bg-background text-on-background font-body-md text-body-md antialiased overflow-hidden">
<!-- Blurred Background (Simulating Home Page) -->
<div aria-hidden="true" class="fixed inset-0 z-0 bg-surface-variant/30 backdrop-blur-sm pointer-events-none">
<!-- Mock Map Background to give context -->
<div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1524661135-423995f22d0b?ixlib=rb-4.0.3&amp;auto=format&amp;fit=crop&amp;w=2000&amp;q=80')] bg-cover bg-center opacity-40 mix-blend-luminosity" data-alt="A highly detailed topographic map spread out on a wooden table, seen from directly above. The map features intricate contour lines and terrain shading in earthy tones of green, brown, and cream. The lighting is soft and natural, suggesting a well-lit cartography studio. The overall aesthetic is professional, precise, and grounded in traditional geography."></div>
<div class="absolute inset-0 bg-primary/5"></div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-md sm:p-lg bg-surface-dim/60 backdrop-blur-md transition-opacity">
<!-- Modal Container -->
<div class="bg-surface-bright rounded-xl shadow-lg border border-outline-variant/30 w-full max-w-lg flex flex-col overflow-hidden transform transition-transform scale-100">
<!-- Modal Header -->
<div class="flex justify-between items-center px-lg py-md border-b border-outline-variant/20 bg-surface">
<h2 class="font-headline-md text-headline-md text-on-surface">Importer une nouvelle carte</h2>
<button aria-label="Fermer" class="text-on-surface-variant hover:text-primary transition-colors p-sm rounded-full hover:bg-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="button">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="p-lg flex flex-col gap-lg">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Sélectionnez un fichier OCAD au format PDF pour l'ajouter à votre projet cartographique.
                </p>
<!-- Drag & Drop Zone -->
<div class="border-2 border-dashed border-outline-variant rounded-lg p-xl flex flex-col items-center justify-center text-center bg-surface-container-lowest hover:bg-surface-container-low hover:border-primary/50 transition-all cursor-pointer group">
<div class="bg-primary-container/20 text-primary-container p-md rounded-full mb-md group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-4xl text-primary" data-icon="upload_file">upload_file</span>
</div>
<p class="font-label-md text-label-md text-on-surface mb-sm">Glissez et déposez votre fichier PDF ici</p>
<p class="font-body-md text-sm text-outline mb-md">ou</p>
<button class="bg-surface-bright border border-secondary text-secondary font-label-md text-label-md px-md py-sm rounded-lg hover:bg-surface-container transition-colors focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-2" type="button">
                        Parcourir les fichiers
                    </button>
<p class="font-label-sm text-label-sm text-outline mt-sm mt-md">Formats acceptés : .pdf (Max 50MB)</p>
</div>
<!-- Selected File Preview (Simulated Active State) -->
<div class="bg-surface-container-low border border-outline-variant/50 rounded-lg p-md flex items-center gap-md">
<div class="bg-error-container text-on-error-container p-sm rounded-md flex-shrink-0">
<span class="material-symbols-outlined" data-icon="picture_as_pdf" data-weight="fill">picture_as_pdf</span>
</div>
<div class="flex-grow overflow-hidden">
<p class="font-label-md text-label-md text-on-surface truncate">topography_alps_2024.pdf</p>
<p class="font-label-sm text-label-sm text-outline">12.4 MB</p>
</div>
<button aria-label="Supprimer le fichier" class="text-on-surface-variant hover:text-error transition-colors p-xs rounded-full focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>
</div>
<!-- Modal Footer -->
<div class="flex justify-end items-center gap-md px-lg py-md border-t border-outline-variant/20 bg-surface-container-lowest">
