<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCAD Map Viewer</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="container">
    <div id="map-panel">
      <div id="map" style="width:100%;height:100%;"></div>

      <button id="btn-back" title="Retour à la liste">←</button>

      <div id="controls">
        <label>
          Opacité carte :
          <input type="range" id="opacity-slider" min="0" max="100" value="70">
          <span id="opacity-value">70%</span>
        </label>
        <label>
          <input type="checkbox" id="toggle-overlay" checked> Carte OCAD
        </label>
        <button id="btn-calibrate" style="padding:3px 8px;font-size:12px;cursor:pointer;border:1px solid #999;border-radius:4px;background:#f5f5f5;">Calibrer</button>
      </div>

      <div id="compass">
        <svg viewBox="0 0 48 48">
          <polygon points="24,4 28,24 24,20 20,24" fill="#e53935" stroke="#b71c1c" stroke-width="1"/>
          <polygon points="24,44 20,24 24,28 28,24" fill="#ccc" stroke="#999" stroke-width="1"/>
          <circle cx="24" cy="24" r="3" fill="#333"/>
        </svg>
      </div>
      <button id="btn-lock-rotation" title="Verrouiller/déverrouiller la rotation">&#x1F512;</button>

      <div id="calibration-panel">
        <h4>Calibration de l'overlay</h4>
        <div class="cal-row">
          <label>Lat ±</label>
          <input type="range" id="cal-lat" min="-50" max="50" value="0" step="1">
          <span class="cal-value" id="cal-lat-val">0.0m</span>
        </div>
        <div class="cal-row">
          <label>Lng ±</label>
          <input type="range" id="cal-lng" min="-50" max="50" value="0" step="1">
          <span class="cal-value" id="cal-lng-val">0.0m</span>
        </div>
        <button id="cal-reset">Reset</button>
        <button id="cal-close">Fermer</button>
      </div>
    </div>

    <div id="divider"></div>

    <div id="street-panel">
      <div id="street-panel-placeholder">
        Cliquez sur la carte pour ouvrir le Street View<br>
        <small>(le marqueur jaune indique la position)</small>
      </div>
      <div id="pano" style="width:100%;height:100%;display:none;"></div>
      <div id="no-streetview-msg">Pas de couverture Street View ici</div>
    </div>
  </div>

  <script src="/js/viewer.js"></script>
</body>
</html>
